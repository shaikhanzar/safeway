<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safeway - Safe Route Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }

    /* Background gradient */
    body {
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      color: #fff;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Raindrops */
    #rain {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
      z-index: 1;
      overflow:hidden;
    }

    .raindrop {
      position: absolute;
      width: 2px;
      height: 15px;
      background: rgba(255, 255, 255, 0.6);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-20px); opacity:1; }
      100% { transform: translateY(100vh); opacity:0; }
    }

    /* Header */
    header {
      text-align: center;
      padding: 80px 20px;
      position: relative;
      z-index: 2;
    }

    header h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    header p {
      font-size: 1.3em;
      color: #d0e6f7;
    }

    /* Main content */
    main {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .routes-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .route-card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      text-align: center;
      color: #fff;
      text-decoration: none;
      display: block;
      transition: 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .route-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      transform: rotate(45deg);
      transition: 0.5s;
    }

    .route-card:hover::before {
      top: -20%;
      left: -20%;
    }

    .route-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    .route-card h3 {
      margin-bottom: 10px;
      font-size: 1.5em;
    }

    .route-card p {
      margin-bottom: 15px;
      font-size: 1em;
      color: #cfd8dc;
    }

    .route-card .status {
      padding: 5px 12px;
      border-radius: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .status.safe { background-color: #28a745; }
    .status.waterlogged { background-color:#dc3545 ; }
    .status.closed { background-color: #ffc107; color:#000; }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      color: #fff;
      background: #111;
      margin-top: 40px;
      position: relative;
      z-index: 2;
    }

    /* Responsive */
    @media(max-width:600px) {
      header h1 { font-size:2.2em; }
      .route-card { padding:20px; }
    }
  </style>
</head>
<body>

  <!-- Rain container -->
  <div id="rain"></div>

  <!-- Header -->
  <header>
    <h1>Safeway</h1>
    <p>Safe Routes | Monsoon Ready</p>
  </header>

  <!-- Main content -->
  <main>
    <div class="routes-list">
      <!-- Safe Route Card -->
      <a href="{% url 'mapp_app:index'%}" class="route-card">
        <h3>Safe Route</h3>
        <p>Find the fastest and safest route</p>
        <span class="status safe">Open</span>
      </a>

      <!-- Rain Precipitation Card -->
      <a href="{% url 'mapp_app:weather'%}" class="route-card">
        <h3>Rain Precipitation</h3>
        <p>Check rainfall & alerts</p>
        <span class="status closed">Check</span>
      </a>

      <!-- SOS Card -->
      <a href="{% url 'mapp_app:sos'%}" class="route-card">
        <h3>SOS</h3>
        <p>Waterlogged Areas</p>
        <span class="status waterlogged">Alert</span>
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 Safe Route Finder | Monsoon Safety First
  </footer>

  <!-- Raindrop JS -->
  <script>
    const rainContainer = document.getElementById('rain');
    const raindropCount = 100;

    for (let i=0;i<raindropCount;i++){
      const drop = document.createElement('div');
      drop.classList.add('raindrop');
      drop.style.left = Math.random()*100 + 'vw';
      drop.style.animationDuration = (0.5 + Math.random()*1.5) + 's';
      drop.style.animationDelay = (Math.random()*2) + 's';
      rainContainer.appendChild(drop);
    }
  </script>

</body>
</html>
